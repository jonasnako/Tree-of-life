<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#cfdcd2" />
    <title>Tree of Life</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="hud">
      <div class="counter" aria-live="off">
        <div class="counter-value" id="ma">4,000</div>
        <div class="counter-unit" id="ma-unit">million years ago</div>
        <div class="counter-eon" id="eon">Archean</div>
      </div>
      <div class="event" id="event" aria-live="polite"></div>
    </div>

    <div class="controls">
      <button id="play" class="btn" type="button" aria-label="Pause">
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      </button>
      <button id="restart" class="btn" type="button" aria-label="Restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <label class="speed">
        <span>Speed</span>
        <input id="speed" type="range" min="-1" max="1" step="0.01" value="0" />
        <output id="speed-value">1.0×</output>
      </label>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
